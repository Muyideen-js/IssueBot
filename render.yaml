services:
  - type: web
    name: issuebot-web
    region: frankfurt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python production.py
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
