name: Drips Smart Bot

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright python-dotenv requests
          python -m playwright install chromium --with-deps

      - name: Restore seen tracker
        uses: actions/cache@v4
        with:
          path: drips_seen.json
          key: drips-seen-${{ github.run_id }}
          restore-keys: drips-seen-

      - name: Restore applied tracker
        uses: actions/cache@v4
        with:
          path: drips_applied.json
          key: drips-applied-${{ github.run_id }}
          restore-keys: drips-applied-

      - name: Write session from secret
        run: |
          mkdir -p sessions
          echo '${{ secrets.DRIPS_SESSION }}' > sessions/drips.json

      - name: Run bot
        continue-on-error: true
        env:
          GITHUB_USERNAME:    ${{ secrets.GH_USERNAME }}
          GITHUB_PASSWORD:    ${{ secrets.GH_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          ROTATE_HOURS:       "1"
          MAX_SLOTS:          "15"
          MAX_PER_REPO:       "2"
          HEADLESS:           "true"
        run: python drips_fast.py 2>&1

      - name: Show bot log
        if: always()
        run: cat bot.log || echo "no log file found"

      - name: Save seen tracker
        uses: actions/cache/save@v4
        if: always()
        with:
          path: drips_seen.json
          key: drips-seen-${{ github.run_id }}

      - name: Save applied tracker
        uses: actions/cache/save@v4
        if: always()
        with:
          path: drips_applied.json
          key: drips-applied-${{ github.run_id }}

      - name: Update session secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f sessions/drips.json ]; then
            gh secret set DRIPS_SESSION --body "$(cat sessions/drips.json)" -R Muyideen-js/IssueBot || true
          fi