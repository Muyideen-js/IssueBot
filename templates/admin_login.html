{% extends "admin_base.html" %}
{% block title %}Administrator sign in · IssueBot{% endblock %}
{% block main_class %}auth-shell{% endblock %}
{% block content %}
<section class="panel stack">
  <div><h1>Administrator sign in</h1><p class="muted">Manage IssueBot user accounts.</p></div>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Admin username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Open admin panel</button>
  </form>
</section>
{% endblock %}
