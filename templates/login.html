<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Bot — Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 380px;
  }
  .logo { font-size: 2rem; text-align: center; margin-bottom: 8px; }
  h1 { text-align: center; font-size: 1.3rem; color: #e6edf3; margin-bottom: 4px; }
  .sub { text-align: center; color: #8b949e; font-size: 0.85rem; margin-bottom: 28px; }
  label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 6px; }
  input[type=password] {
    width: 100%;
    padding: 10px 14px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=password]:focus { border-color: #58a6ff; }
  .error {
    background: #3d1f1f;
    border: 1px solid #f85149;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 0.85rem;
    color: #f85149;
    margin-bottom: 16px;
  }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 11px;
    background: #238636;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #2ea043; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🤖</div>
  <h1>Issue Bot</h1>
  <p class="sub">GrantFox + Drips Wave Automation</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password" autofocus>
    <button type="submit">Sign In</button>
  </form>
</div>
</body>
</html>
