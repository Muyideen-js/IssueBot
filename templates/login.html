<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IssueBot — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .bg-glow {
    position: absolute;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(88, 166, 255, 0.15) 0%, rgba(13, 17, 23, 0) 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    pointer-events: none;
  }
  .card {
    position: relative;
    z-index: 1;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 40px 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    text-align: center;
  }
  .brand-badge {
    display: inline_flex;
    align-items: center;
    gap: 8px;
    background: rgba(56, 139, 253, 0.1);
    border: 1px solid rgba(56, 139, 253, 0.3);
    color: #58a6ff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 20px;
  }
  h1 { font-size: 1.5rem; font-weight: 700; color: #f0f6fc; margin-bottom: 6px; }
  .sub { color: #8b949e; font-size: 0.88rem; margin-bottom: 28px; line-height: 1.4; }
  
  .btn-github {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 12px 18px;
    background: #238636;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: #ffffff;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
  }
  .btn-github:hover {
    background: #2ea043;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(46, 160, 67, 0.4);
  }

  .divider {
    display: flex;
    align-items: center;
    color: #484f58;
    font-size: 0.78rem;
    margin: 24px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #21262d;
  }
  .divider span { padding: 0 10px; }

  label { display: block; text-align: left; font-size: 0.82rem; color: #8b949e; margin-bottom: 6px; }
  input[type=password] {
    width: 100%;
    padding: 11px 14px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #c9d1d9;
    font-size: 0.92rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=password]:focus { border-color: #58a6ff; }
  
  .btn-pass {
    width: 100%;
    margin-top: 14px;
    padding: 11px;
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #c9d1d9;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-pass:hover { background: #30363d; color: #f0f6fc; }

  .error {
    background: rgba(248, 81, 73, 0.1);
    border: 1px solid #f85149;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.85rem;
    color: #f85149;
    margin-bottom: 20px;
    text-align: left;
  }

  .github-icon { width: 20px; height: 20px; fill: currentColor; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="card">
  <div class="brand-badge">🤖 IssueBot AI</div>
  <h1>Welcome Back</h1>
  <p class="sub">GrantFox + Drips Wave Automation</p>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  <a href="/login/github" class="btn-github">
    <svg class="github-icon" viewBox="0 0 16 16">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    Sign in with GitHub
  </a>

  <div class="divider"><span>or password</span></div>

  <form method="POST">
    <label for="password">Dashboard Password</label>
    <input type="password" id="password" name="password" placeholder="Enter password">
    <button type="submit" class="btn-pass">Sign In</button>
  </form>
</div>
</body>
</html>
