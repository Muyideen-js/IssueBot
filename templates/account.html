{% extends "base.html" %}
{% block title %}Account · IssueBot{% endblock %}
{% block content %}
<section class="panel stack" style="max-width:600px;margin:auto">
  <div><h1>Account security</h1><p class="muted">Change the temporary password you received from the administrator.</p></div>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="10" required></label>
    <label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="10" required></label>
    <button>Update password</button>
  </form>
</section>
{% endblock %}
