<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{% block title %}IssueBot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('app_stylesheet') }}">
</head>
<body class="portal-area">
{% if current_user %}
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="{{ url_for('user_dashboard') }}"><span class="brand-mark">IB</span><span>IssueBot</span><span class="brand-context">Wave workspace</span></a>
  <nav class="navlinks" aria-label="User navigation">
    <a class="{{ 'active' if request.endpoint == 'user_dashboard' else '' }}" href="{{ url_for('user_dashboard') }}">Dashboard</a>
    <a class="{{ 'active' if request.endpoint == 'settings' else '' }}" href="{{ url_for('settings') }}">Setup</a>
    <a class="nav-user {{ 'active' if request.endpoint == 'account' else '' }}" href="{{ url_for('account') }}">{{ current_user.username }}</a>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary">Sign out</button></form>
  </nav>
</div></header>
{% endif %}
<main class="{% block main_class %}container{% endblock %}">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
