<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{% block title %}IssueBot Admin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="admin-area">
{% if current_user and current_user.is_admin %}
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="{{ url_for('admin_dashboard') }}"><span class="brand-mark">IB</span><span>IssueBot</span><span class="brand-context">Administration</span></a>
  <div class="navlinks"><span class="admin-kicker">Admin access</span><form method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary">Sign out</button></form></div>
</div></header>
{% endif %}
<main class="{% block main_class %}container{% endblock %}">
  {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
